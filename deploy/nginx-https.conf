# Install only after issuing the musetrack.ru certificate.
server {
    listen 80;
    server_name musetrack.ru 155.212.164.198;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://musetrack.ru$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name musetrack.ru;
    ssl_certificate /etc/letsencrypt/live/musetrack.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/musetrack.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:MuseTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    root /srv/muse/current/public;
    client_max_body_size 260M;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        if (-f /srv/muse/maintenance) { return 503; }
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        if (-f /srv/muse/maintenance) { return 503; }
        include fastcgi_params;
        fastcgi_pass unix:/run/php/muse.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTPS $https if_not_empty;
        internal;
    }

    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }
}
