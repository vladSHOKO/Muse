name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: PHP ${{ matrix.php }} / PostgreSQL 17
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
    env:
      APP_ENV: test
      APP_DEBUG: '1'
      APP_SECRET: ci-only-not-a-production-secret
      # Doctrine adds _test in the test environment.
      DATABASE_URL: postgresql://task_tracker:ci_password@127.0.0.1:5432/task_tracker?serverVersion=17&charset=utf8
      UPLOAD_DIR: var/test-uploads
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: task_tracker_test
          POSTGRES_USER: task_tracker
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U task_tracker -d task_tracker_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ctype, fileinfo, iconv, pdo_pgsql, mbstring, intl, dom, xml, xmlwriter
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Validate Composer configuration
        run: composer validate --strict
      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Check actual PHP platform
        run: composer check-platform-reqs
      - name: Check PHP syntax
        run: find src tests migrations config public bin -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l
      - name: Check JavaScript syntax
        run: find public/assets -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check
      - name: Apply migrations to a fresh test database
        run: php bin/console doctrine:migrations:migrate --no-interaction
      - name: Validate Doctrine schema
        run: php bin/console doctrine:schema:validate
      - name: Lint Symfony and run PHPUnit
        run: composer check
